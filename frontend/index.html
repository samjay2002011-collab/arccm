<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CM — Inventory &amp; Loadout Manager</title>
<!-- 🛡️ SHIELD: حماية ضد نسخ الكود — أول حاجة تتحمل -->
<script src="/shield.js?v=2"></script>
<link rel="preload" href="/app.js?v=240" as="script">
<link rel="icon" href="/favicon.png?v=1">
<link rel="stylesheet" href="/styles.css?v=72">
<link rel="stylesheet" href="/accounts.css?v=38">
<link rel="stylesheet" href="/loadout.css?v=39">
<link rel="stylesheet" href="/phase10.css?v=29">
<link rel="stylesheet" href="/traders.css?v=34">
<link rel="stylesheet" href="/workshop.css?v=33">
<link rel="stylesheet" href="/scrappy.css?v=3">
<link rel="stylesheet" href="/sync.css?v=1">
</head>
<body>
<header class="topbar">
  <div class="bar-left">
    <span class="cm-mark" title="CM" aria-label="CM">
      <svg viewBox="0 0 44 44" width="30" height="30" role="img" aria-label="CM">
        <defs>
          <linearGradient id="cmgrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#d946ef"/>
          </linearGradient>
        </defs>
        <rect x="1.6" y="1.6" width="40.8" height="40.8" rx="12" fill="#0e0e15"/>
        <rect x="1.6" y="1.6" width="40.8" height="40.8" rx="12" fill="url(#cmgrad)" opacity=".16"/>
        <rect x="1.6" y="1.6" width="40.8" height="40.8" rx="12" fill="none" stroke="url(#cmgrad)" stroke-width="2"/>
        <text x="22" y="22.5" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="900" fill="#fff" letter-spacing="-0.3">CM</text>
        <circle cx="32.6" cy="11.4" r="2.7" fill="#e0b64a"/>
      </svg>
    </span>
    <nav class="nav">
      <button class="nav-item active" data-view="inventory" title="INVENTORY — stash and loadout"><img class="nav-ico" src="/icons/bag.webp" alt=""></button>
      <button class="nav-item" data-view="traders" title="TRADERS — traders, their prices and the buy list"><img class="nav-ico" src="/assets/items/metaforge/coins.webp" alt=""></button>
      <button class="nav-item" data-view="workshop" title="WORKSHOP — craft recipes, your materials and the craft list"><img class="nav-ico" src="/icons/hammer.svg" alt=""></button>
    </nav>
    <div class="wallet" id="wallet"></div>
  </div>
  <button class="pill sync-pill" id="btn-live-sync" title="SYNCHRONIZE — instant pull of the game state (stash/loadout/coins) from the Embark Pioneer gateway">
    <span class="sync-ico">⟳</span><span class="sync-label">SYNCHRONIZE</span>
  </button>
  <div class="bar-right">
    <div id="view-as-bar" style="display:none !important; align-items:center; gap:10px; background:linear-gradient(135deg, rgba(34,197,94,.18), rgba(168,85,247,.22)); border:1px solid #22c55e; border-radius:20px; padding:5px 16px; font-size:12px; font-weight:800; color:#fff; box-shadow:0 0 15px rgba(34,197,94,.25);">
      <span>👁️ وضع الأدمن: تتصفح حساب المشترك <b id="view-as-name" style="color:#22c55e; text-decoration:underline;">—</b></span>
      <a href="/admin/exit-view-as?to=/admin" style="margin-left:8px; background:linear-gradient(135deg, #a855f7, #d946ef); color:#fff; padding:4px 12px; border-radius:8px; text-decoration:none; font-size:10px; font-weight:800;" title="العودة للوحة الأدمن وقائمة المشتركين">↩ العودة للوحة الأدمن والمشتركين</a>
    </div>
    <div class="acc-switch" id="acc-switch"></div>
    <!-- ⚙️ GEAR / SETTINGS MENU -->
    <div class="gear-menu-wrap" id="gear-menu-wrap">
      <button class="acc-tab acc-manage" id="btn-gear-toggle" type="button" title="الإعدادات وإدارة الحسابات (Settings & Admin)">
        <img class="nav-ico" src="/icons/gear.webp" alt="⚙">
      </button>
      <div id="gear-dropdown" class="gear-dropdown" style="display:none;">
        <div class="gear-dropdown-header">
          <div style="display:flex; align-items:center; gap:6px;">
            <img src="/icons/gear.webp" style="width:14px; height:14px;" alt="">
            <span>الإعدادات والتحكم</span>
          </div>
          <button id="btn-gear-close" type="button" title="إغلاق">✕</button>
        </div>

        <!-- 🔐 ADMIN MODE BUTTON -->
        <button class="gear-btn-admin" id="btn-admin-mode" style="display:none;" type="button" title="ADMIN MODE">
          <span style="font-size:14px;">⚙️</span>
          <span>ADMIN MODE</span>
        </button>

        <div class="gear-section-divider"></div>

        <!-- 📋 MANAGE ACCOUNTS -->
        <button class="gear-item-btn" id="btn-gear-accounts" type="button" title="إدارة الحسابات وإضافة التوكنات">
          <span style="font-size:14px;">📋</span>
          <span style="flex:1; text-align:left;">إدارة وتعديل الحسابات (Accounts)</span>
          <span style="color:#64748b; font-size:11px;">›</span>
        </button>
      </div>
    </div>
    <div class="queue-wrap">
      <button class="pill queue-pill" id="btn-queue" hidden title="QUEUED MOVES — moves waiting for Embark to reopen the write route; they run on their own the moment it is back">
        <span class="queue-ico">⏳</span><span id="queue-count">0</span>
      </button>
      <div class="queue-pop" id="queue-pop" hidden></div>
    </div>
    <button class="pill danger" id="btn-unlock" hidden title="✕ CANCEL — unlocks the panel locked after ↑ UPDATE and makes dragging and adding work again">✕ CANCEL</button>
    <a href="/auth/logout" class="pill" id="btn-topbar-logout" title="LOGOUT — تسجيل الخروج" style="text-decoration:none; color:#f87171; border-color:rgba(239,68,68,.3); background:rgba(239,68,68,.08); display:flex; align-items:center; gap:6px;">
      <span style="font-size:12px;">🚪</span><span>LOGOUT</span>
    </a>
  </div>
</header>

<div class="mode-banner" id="mode-banner" hidden></div>

<main class="inv-page" id="view-inventory">
  <div id="column-host" class="inv-grid"></div>
</main>

<main class="traders-page" id="view-traders" hidden>
  <header class="tr-head">
    <div class="tr-title">
      <h2>TRADERS</h2>
    </div>
    <div class="spacer"></div>
    <div class="tr-wallet" id="tr-wallet"></div>
  </header>
  <section class="tr-plan" id="tr-plan" hidden></section>
  <div class="tr-grid" id="traders"></div>
</main>

<main class="ws-page" id="view-workshop" hidden>
  <header class="ws-head">
    <div class="ws-title">
      <h2>WORKSHOP</h2>
      <input class="ws-search" id="ws-search" type="search" placeholder="Search recipes or materials…" autocomplete="off">
    </div>
  </header>
  <section class="ws-plan" id="ws-plan" hidden></section>
  <!-- station columns — same layout as the traders page: icon art and name only, details live in the window -->
  <div class="ws-cols" id="ws-cols"></div>
</main>

<div class="sel-float" id="sel-float" hidden>
  <span id="sel-float-count"></span>
</div>

<main class="accounts-page" id="view-accounts" hidden>
  <section class="acct-card" id="acct-add-card">
    <div id="acct-admin-quick-bar" style="display:none; margin-bottom:16px; padding:10px 14px; background:linear-gradient(135deg, rgba(168,85,247,.15), rgba(59,130,246,.15)); border:1px solid rgba(168,85,247,.35); border-radius:10px; align-items:center; justify-content:space-between; gap:10px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:16px;">🔐</span>
        <div>
          <b style="color:#f3e8ff; font-size:12px;">Admin Controls</b>
          <div style="color:#94a3b8; font-size:11px;">لوحة الإدارة وقائمة المشتركين</div>
        </div>
      </div>
      <button class="pill primary" id="btn-admin-mode-page" type="button" style="font-size:11px; padding:6px 14px; cursor:pointer;">OPEN ADMIN PANEL</button>
    </div>
    <h1>Accounts</h1>
    <div id="acct-assign-existing-box" style="display:none; margin-bottom:18px; padding:14px 16px; background:linear-gradient(135deg, rgba(34,197,94,0.1), rgba(168,85,247,0.12)); border:1px solid rgba(34,197,94,0.3); border-radius:12px;">
      <label style="display:block; font-size:11px; font-weight:800; letter-spacing:1px; color:#22c55e; margin-bottom:8px;">
        🔗 ربط حساب لعبة مسجل مسبقاً في النظام بهذا المشترك
      </label>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <select id="acct-existing-select" style="flex:1; min-width:200px; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.15); background:#14141d; color:#e8e8ef; font:inherit; font-size:12px; font-weight:700;">
          <option value="">-- اختر حساب لعبة من السيرفر --</option>
        </select>
        <button class="btn-primary" id="btn-assign-existing" style="padding:10px 18px; font-size:11px; font-weight:800; background:linear-gradient(135deg, #22c55e, #16a34a); color:#000;">+ ربط بالمشترك</button>
      </div>
      <div id="acct-assign-note" style="margin-top:8px; font-size:11px; font-weight:600; min-height:16px;"></div>
    </div>
    <div class="acct-form">
      <div class="field">
        <label for="acct-token">
          <span class="req">REQUIRED</span> AUTHORIZATION TOKEN
        </label>
        <div class="input-wrap">
          <span class="key-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="8" cy="15" r="4"/><path d="M10.85 12.15 19 4"/><path d="m18 5 2 2"/><path d="m15 8 2 2"/>
            </svg>
          </span>
          <input id="acct-token" type="password" autocomplete="off" spellcheck="false"
                 placeholder="Bearer eyJhbG...">
        </div>
      </div>
      <div class="field">
        <label for="acct-label">ACCOUNT LABEL (OPTIONAL)</label>
        <input id="acct-label" type="text" maxlength="64" placeholder="e.g. Main Account">
      </div>
      <div class="field add-field">
        <button class="btn-primary" id="acct-add"><span class="plus">+</span> Add</button>
      </div>
    </div>
    <p class="form-note" id="acct-note"></p>
  </section>

  <section class="acct-card" id="acct-list-card">
    <div class="acct-list-head">
      <h1>My Accounts</h1>
      <div class="capacity">
        <span class="cap-label">ACCOUNTS</span>
        <span class="cap-value" id="cap-value">0</span>
      </div>
    </div>
    <div class="acct-rows" id="acct-rows"></div>
  </section>
</main>

<div class="ctx" id="ctx" hidden></div>
<div class="item-card" id="item-card" hidden></div>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-head"><h3 id="d-name"></h3><button class="ghost tiny" id="d-close">✕</button></div>
  <div class="drawer-body" id="d-body"></div>
  <div class="drawer-foot" id="d-foot"></div>
</div>

<div class="sys-backdrop" id="sys-backdrop" hidden></div>
<aside class="sys-drawer" id="sys-drawer" hidden>
  <div class="sys-head">
    <span class="bar blue"></span><h3>SYSTEM PANELS</h3>
    <div class="spacer"></div>
    <button class="ghost tiny" id="sys-close" title="Close panels">✕</button>
  </div>
  <div class="sys-body">
    <section class="panel">
      <div class="panel-head"><span class="bar blue"></span><h2>CONNECTION</h2>
        <div class="spacer"></div>
        <button class="ghost tiny" id="btn-sync" title="Instant pull for every account (read only)">↻ SYNC</button>
      </div>
      <div class="kv" id="status-box"></div>
      <p class="promo-dl in-panel" data-agent-dl="1"></p>
    </section>
    <section class="panel">
      <div class="panel-head"><span class="bar green"></span><h2>RARITY</h2></div>
      <div class="legend" id="legend-box"></div>
    </section>
    <section class="panel">
      <div class="panel-head"><span class="bar amber"></span><h2>ACTION LOG</h2></div>
      <div class="log" id="log-box"></div>
    </section>
  </div>
</aside>

<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <h3 id="m-title"></h3>
    <button class="modal-x" id="m-x" type="button" title="Close" aria-label="Close">✕</button>
    <div id="m-body"></div>
    <div class="modal-foot">
      <button class="ghost" id="m-cancel">CLOSE</button>
      <button class="pill primary" id="m-confirm" hidden>CONFIRM</button>
    </div>
  </div>
</div>

<div class="modal" id="admin-auth-modal" hidden style="background:rgba(0,0,0,.75); z-index:99999;">
  <div class="modal-card" style="max-width:380px; text-align:center;">
    <h3 style="margin:0 0 10px; font-size:16px; letter-spacing:2px; font-weight:800; color:#fff;">🔐 ADMIN MODE</h3>
    <p style="margin:0 0 18px; font-size:12px; color:var(--muted);">Enter admin password to open panel</p>
    <div style="margin-bottom:14px;">
      <input id="admin-mode-pw" type="password" placeholder="Admin password…" style="width:100%; box-sizing:border-box; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; color:#fff; padding:12px 14px; font:inherit; font-size:13px;">
    </div>
    <div id="admin-mode-err" style="color:var(--red); font-size:12px; min-height:18px; margin-bottom:12px;"></div>
    <div class="modal-foot" style="justify-content:center; gap:10px; margin-top:0;">
      <button class="ghost" id="admin-mode-cancel" type="button">CANCEL</button>
      <button class="pill primary" id="admin-mode-unlock" type="button">UNLOCK</button>
    </div>
  </div>
</div>

<script src="/app.js?v=240"></script>
<script src="/admin_mode.js?v=8"></script>
</body>
</html>
